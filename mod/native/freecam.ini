[freecam]
; Your settings are kept in %LOCALAPPDATA%\KillHouseGames\DoorKickers2\dk2ml\dk2_freecam\freecam.ini (this copy in the
; mod folder only holds the defaults). Delete that file to start over from the defaults.
; Everything here can also be changed in-game: click the camera button in the Esc menu (bottom right), or press Shift + toggleViewKey.
; Keys are virtual-key codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
; Mouse buttons work too: 0x04 = middle, 0x05 = mouse 4 (back), 0x06 = mouse 5 (forward).
; Hold this (0x12 = Alt) and move the mouse: left/right rotates, up/down tilts, around the center of the screen.
rotateModifier=0x12
; Hold this (0x11 = Ctrl) and move the mouse to look around in place, up to the horizon.
lookModifier=0x11
; Turn the camera with keys (0x5A = Z, 0x43 = C).
rotateLeftKey=0x5A
rotateRightKey=0x43
; Flips between the top view (north-up, tilted by topDownTilt) and your rotated/tilted view (0xC0 = backtick/tilde on
; US layouts).
toggleViewKey=0xC0
; Glides back to north-up (rotation 0) around the screen center, keeping the tilt (0x56 = V).
resetHeadingKey=0x56
; Degrees per press of the rotate keys, with a short glide (0-90, e.g. 45 or 90). 0: the camera turns while the key is
; held.
rotateStep=0.00
; Mouse speed for rotating, tilting and looking around (0.1-5).
mouseSensitivity=0.45
; 1 reverses both directions of that drag (orbit = rotateModifier, look = lookModifier).
reverseOrbitDrag=0
reverseLookDrag=1
; 1: missions start in the top view (after troop placement). 0: the stock camera until you use Free Camera.
startInTopView=1
; Where the top view (toggleViewKey) centers: 0 = on the trooper nearest the mouse cursor, 1 = it keeps the screen
; center.
topViewScreenCenter=0
; 1: when toggleViewKey switches to the top view, the cursor goes to the screen center (onto what it centers on).
cursorToCenterOnTopView=1
; The toggle key's top view: tilt in degrees (0-30), still facing north. 0 = straight down.
topDownTilt=20.00
; Degrees per second for the rotate keys while held (10-360).
keyRotateSpeed=85.00
; How far the camera may tilt away from straight down, in degrees (10-75).
maxTilt=60.00
; While dragging: 1 hides the cursor, 0 shows a "move" cursor.
hideCursorWhileDragging=0
; After a drag: 1 puts the cursor at the screen center (the point the camera turned around), 0 back where it started.
cursorToCenterAfterDrag=0
; 0: what the camera looks at (the center of the screen) stays over the map; tilted, the camera itself may stand
; outside to look at an edge. 1: the camera may go anywhere.
allowOutsideMap=0
; With allowOutsideMap=0: how far past the map edges the camera may look, in world units (0-200).
edgeRoom=15.00
; Closest zoom as a fraction of the stock minimum height (0.02-1, 1 = stock). Very low values clip through things.
zoomInFactor=0.02
; Farthest zoom as a multiple of the stock maximum height (1-5, 1 = stock).
zoomOutFactor=2.00
; Seconds the camera takes to ease into a new angle (0 = instant, max 0.5). The top-down toggle animates a bit longer.
smoothing=0.05
; 1: map icons (waypoint actions, doors, grenade targets, ...) stand upright facing the camera while Free Camera is in
; use. 0: they lie flat on the ground as in the stock view.
uprightIcons=1
